var slides = [
{k:'板块① · 封面',h:'<h1><span>固体废弃物处理与处置</span></h1><div class="sub">第三次课 · 第二章 来源、特性与鉴别（一）· 零收购砂轮厂案例</div><div class="sub">黄正文 教授 · 成都大学环境工程系 · 2026年9月21日</div><div class="motto"><span class="a">绿水青山＝金山银山</span> ｜ <span class="b">好好学习 天天向上</span></div>'},

{k:'板块② · 鉴别定义',h:'<h2>固废鉴别定义</h2>',li:['判定某物是否属固废、是否属危险废物','判定结论<b>有法律效力</b>']},

{k:'板块② · AI鉴别',h:'<h2>AI 鉴别辅助＋人工复核</h2>',li:['AI 智能体初筛，结论<b>必须人工复核</b>（防 AI 幻觉）']},

{k:'板块② · 播音小结①',h:'<h2>播音小结 ① · 法律账→资产账</h2>',li:['承上启下 · 约90秒 · 点击即播'],au:A1},
{k:'板块② · 过渡',h:'<h2>过渡</h2>',li:['法律只能告诉你「是不是废」，不能告诉你「废里有没有宝」→ <b>资产账</b>']},
{k:'板块③ · 导语+定位',h:'<h2>零收购砂轮厂案 · 生命周期定位</h2>',li:['生命周期三阶段：<b>源头 → 过程 → 末端</b>','零收购案落在「过程」（资源化·变废为宝）']},
{k:'板块③ · 情境',h:'<h2>1998 · 龙马砂轮厂</h2>',li:['濒临倒闭：12名工人 / 70年代苏联老设备','说明书俄文 / 原料断 / 市场饱和']},
{k:'板块③ · 零元接手',h:'<div class="big"><span class="g">零元</span>收购</div>',li:['资产归己、债务归己、工人归己——零元背下一整个包袱']},
{k:'板块③ · 七策1-4',h:'<h2>七策（1–4）</h2>',li:['① 商务谈判 ② 分期付款','③ 出让股权 ④ 河南赊原料']},
{k:'板块③ · 七策5-7',h:'<h2>七策（5–7）</h2>',li:['⑤ 以砂轮换垫圈 ⑥ 自改配方降本三成','⑦ 跑遍成都五金市场']},
{k:'板块③ · 结果',h:'<h2>结果：一年半关门</h2>',li:['卖面包车发十二人遣散费']},
{k:'板块③ · 败绩型资产化',h:'<h2>败绩型资产化</h2>',li:['七策沉淀为<b>无形资产</b>（谈判方法论/成本直觉/技改手感/渠道门路）','<b class="g">垃圾资产 → 黄金资产</b>']},
{k:'板块③ · 双创映射',h:'<h2>七策 → 工程能力</h2>',li:['谈判=沟通 分期=财务 让股=整合 赊料=诚信','以物易物=置换 改配方=降本 跑市场=获客']},
{k:'板块③ · 金句',h:'<div class="big"><span class="g">教训与经验，都是无形资产</span><br>垃圾资产，也能打成黄金资产</div>'},
{k:'板块③ · 播音小结②',h:'<h2>播音小结 ② · 收口承上启下</h2>',li:['两本账焊成一句 · 约90秒 · 点击即播'],au:A2},
{k:'板块③ · 过渡',h:'<h2>过渡</h2>',li:['法律账和资产账，在这里碰头了']},
{k:'板块④ · 并线结论',h:'<h2>并线结论</h2>',li:['法律问「还算不算固废」，商业问「还能不能变资产」','<b class="g">换一本账，废物变资源</b>']},
{k:'板块④ · 作业',h:'<h2>作业布置（留痕四步法）</h2>',li:['用 AI 查「法典'资源化产物不再属于固废'判定条件」，逐条核对标错']},
{k:'板块④ · 下次预告',h:'<h2>下次预告</h2>',li:['第二章鉴别应用收尾 → 第三章收集、运输与贮存']},
{k:'板块④ · 思政收尾',h:'<div class="big"><span class="g">绿水青山就是金山银山</span><br>好好学习 天天向上</div>',li:['鉴别守红线 · 零收购守眼光 · 七策七能力']},
{k:'板块④ · 结束',h:'<div class="big"><span class="g">谢谢</span></div>',li:['点暇斋 · 故事云驱动 · 素材母库 S001-S021']}
];

var stage = document.getElementById('stage');
var cur = 0, total = slides.length;
document.getElementById('total').textContent = total;

var voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){ if(!voices.length) return null; var v = voices.find(function(x){ return /zh|cmn|chinese/i.test(x.lang) && /female|xiao|huihui|yaoyao|ting/i.test(x.name); }); if(!v) v = voices.find(function(x){ return /zh|cmn|chinese/i.test(x.lang); }); return v || null; }
function speak(text, btn){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音合成，请用 Edge 或 Chrome 打开'); return; }
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn){ btn.classList.remove('playing'); btn.innerHTML='▶ 播放小结'; } return; }
  var u = new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=0.95; u.pitch=1.0;
  var v = pickVoice(); if(v) u.voice = v;
  u.onend = function(){ if(btn){ btn.classList.remove('playing'); btn.innerHTML='▶ 播放小结'; } };
  u.onerror = function(){ if(btn){ btn.classList.remove('playing'); btn.innerHTML='▶ 播放小结'; } };
  speechSynthesis.speak(u);
  if(btn){ btn.classList.add('playing'); btn.innerHTML='<span class="dot"></span> 正在播报 · 点击停止'; }
}

function render(i){
  var s = slides[i];
  var html = '<div class="slide active"><div class="kicker">'+s.k+'</div>'+s.h+(s.li?'<ul>'+s.li.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':'');
  if(s.au){ html += '<div><button class="speak" data-i="'+i+'">▶ 播放小结</button></div>'; }
  html += '</div>';
  stage.innerHTML = html;
  if(s.au){ var b = stage.querySelector('.speak'); b.onclick = function(){ speak(s.au, b); }; }
  document.getElementById('cur').textContent = i+1;
  document.getElementById('prog').style.width = ((i+1)/total*100)+'%';
}
function go(i){ if(i<0)i=0; if(i>total-1)i=total-1; speechSynthesis.cancel(); cur=i; render(i); }
document.getElementById('prev').onclick=function(){go(cur-1)};
document.getElementById('next').onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)} if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)} });
render(0);
</script>
