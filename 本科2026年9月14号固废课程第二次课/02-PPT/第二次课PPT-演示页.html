var stage = document.getElementById('stage');
var cur = 0, total = slides.length;
document.getElementById('total').textContent = total;

function render(i){
  stage.innerHTML = '<div class="slide active"><div class="kicker">'+slides[i].k+'</div>'+slides[i].h+(slides[i].li?'<ul>'+slides[i].li.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':'')+'</div>';
  document.getElementById('cur').textContent = i+1;
  document.getElementById('prog').style.width = ((i+1)/total*100)+'%';
}
function go(i){ if(i<0)i=0; if(i>total-1)i=total-1; cur=i; render(i); }
document.getElementById('prev').onclick=function(){go(cur-1)};
document.getElementById('next').onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)} if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)} });
render(0);
</script>
