var stage = document.getElementById('stage');
var cur = 0, total = slides.length;
document.getElementById('total').textContent = total;
function render(i){
  var s = slides[i];
  var html = '<div class="slide active"><div class="kicker">'+s.k+'</div>'+s.h;
  if(s.vid){ html += '<div class="vwrap"><video controls preload="metadata" src="'+s.vid+'"></video><div class="vtip">'+s.tip+' · 点开即播</div></div>'; }
  else if(s.li){ html += '<ul>'+s.li.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'; }
  html += '</div>';
  stage.innerHTML = html;
  document.querySelectorAll('video').forEach(function(v){ v.pause(); });
}
function show(i){ cur=(i+total)%total; render(cur); document.getElementById('cur').textContent=cur+1; document.getElementById('prog').style.width=((cur+1)/total*100)+'%'; }
function next(){ show(cur+1); } function prev(){ show(cur-1); }
document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev;
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();} if(e.key==='ArrowLeft'){e.preventDefault();prev();} });
document.getElementById('stage').addEventListener('click',function(e){ if(e.target.tagName==='VIDEO'||e.target.tagName==='BUTTON')return; next(); });
show(0);
