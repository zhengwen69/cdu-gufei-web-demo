var stage = document.getElementById('stage');
var cur = 0, total = slides.length;
document.getElementById('total').textContent = total;

var voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){ if(!voices.length) return null; var v = voices.find(function(x){ return /zh|cmn|chinese/i.test(x.lang) && /female|xiao|huihui|yaoyao|ting/i.test(x.name); }); if(!v) v = voices.find(function(x){ return /zh|cmn|chinese/i.test(x.lang); }); return v || null; }
function speak(text, btn){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音合成，请用 Edge 或 Chrome 打开'); return; }
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn){ btn.classList.remove('playing'); btn.innerHTML='▶ 播放小结'; } return; }
  var u = new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=0.95; u.pitch=1.0;
  var v = pickVoice(); if(v) u.voice = v;
  u.onend = function(){ if(btn){ btn.classList.remove('playing'); btn.innerHTML='▶ 播放小结'; } };
  u.onerror = function(){ if(btn){ btn.classList.remove('playing'); btn.innerHTML='▶ 播放小结'; } };
  speechSynthesis.speak(u);
  if(btn){ btn.classList.add('playing'); btn.innerHTML='<span class="dot"></span> 正在播报 · 点击停止'; }
}

function render(i){
  var s = slides[i];
  var html = '<div class="slide active"><div class="kicker">'+s.k+'</div>'+s.h;
  if(s.vid){ html += '<div class="vwrap"><video controls preload="metadata" src="'+s.vid+'"></video><div class="vtip">'+s.tip+' · 点开即播（浏览器原生播放）</div></div>'; }
  else if(s.li){ html += '<ul>'+s.li.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'; }
  if(s.au){ html += '<div><button class="speak" data-i="'+i+'">▶ 播放小结</button></div>'; }
  html += '</div>';
  stage.innerHTML = html;

  // 翻页时暂停所有正在播放的视频/语音
  var olds = document.querySelectorAll('video');
  olds.forEach(function(v){ v.pause(); });

  var btns = stage.querySelectorAll('.speak');
  btns.forEach(function(b){
    b.onclick = function(){
      var text = slides[i].au;
      if(b.classList.contains('playing')){ speechSynthesis.cancel(); b.classList.remove('playing'); b.innerHTML='▶ 播放小结'; }
      else { speak(text, b); }
    };
  });
}

function show(i){
  cur = (i + total) % total;
  render(cur);
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('prog').style.width = ((cur+1)/total*100) + '%';
}

function next(){ show(cur + 1); }
function prev(){ show(cur - 1); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); next(); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
});
document.getElementById('stage').addEventListener('click', function(e){
  if(e.target.tagName === 'VIDEO' || e.target.tagName === 'BUTTON') return;
  next();
});

show(0);
</script>
