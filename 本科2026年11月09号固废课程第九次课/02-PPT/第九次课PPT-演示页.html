#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:40px 60px}

@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide .kicker{font-size:13px;letter-spacing:3px;color:#5b9bd5;margin-bottom:10px}
.slide h1{font-size:40px;color:#fff;margin-bottom:14px;line-height:1.25}

.slide ul{list-style:none;margin-top:8px}
.slide li{font-size:18px;line-height:1.9;color:#b8c4ce;padding:3px 0;position:relative;padding-left:24px}
.slide li::before{content:"▸";position:absolute;left:0;color:#2ecc71}
.slide li b{color:#e67e22}.slide li .g{color:#2ecc71}
.big{font-size:38px;color:#fff;text-align:center;margin:16px 0}

#chrome .pg{font-size:13px;color:#8899aa;min-width:60px;text-align:center}
#chrome .bar{flex:1;max-width:400px;height:3px;background:rgba(91,155,213,.15);border-radius:2px;overflow:hidden}
#chrome .bar i{display:block;height:100%;background:#2ecc71;width:0;transition:width .3s}
#chrome button{background:rgba(91,155,213,.12);border:1px solid rgba(91,155,213,.2);color:#7fb8e0;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px}
#chrome button:hover{border-color:#5b9bd5;color:#fff}
.back-btn{position:fixed;top:18px;left:18px;z-index:10;padding:6px 14px;border-radius:8px;background:rgba(13,31,53,.85);border:1px solid rgba(91,155,213,.2);color:#7fb8e0;text-decoration:none;font-size:13px}
.hint{position:fixed;top:18px;right:18px;font-size:11px;color:#445}
@media (max-width:768px){#stage{padding:20px}.slide h1{font-size:26px}.slide li{font-size:14px}.big{font-size:28px}.vwrap video{max-height:260px}}
</style>

{k:'板块② · 视频01',h:'<h2>🎬 AI 数字孪生垃圾焚烧</h2>',vid:V+'01-AI数字孪生焚烧.mp4',tip:'1\' · 数字孪生 垃圾焚烧发电 3D 可视化'},

{k:'板块③ · 视频02',h:'<h2>🎬 热解工艺流程</h2>',vid:V+'02-热解工艺流程.mp4',tip:'6\' · 热解工艺流程'},
{k:'板块③ · 视频03',h:'<h2>🎬 固体废物热解处理</h2>',vid:V+'03-固体废物热解.mp4',tip:'38\' · 固体废物的热解处理'},

{k:'板块⑤ · 思政收尾',h:'<div class="big"><span class="g">绿水青山就是金山银山</span><br>好好学习 天天向上</div>',li:['AI 更聪明地烧、热解气化更彻底变废为宝 · 热化学三兄弟分清，第五章吃透']}
];

var stage = document.getElementById('stage');
var cur = 0, total = slides.length;
document.getElementById('total').textContent = total;
function render(i){
  var s = slides[i];
  var html = '<div class="slide active"><div class="kicker">'+s.k+'</div>'+s.h;
  if(s.vid){ html += '<div class="vwrap"><video controls preload="metadata" src="'+s.vid+'"></video><div class="vtip">'+s.tip+' · 点开即播</div></div>'; }
  else if(s.li){ html += '<ul>'+s.li.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'; }
  html += '</div>';
  stage.innerHTML = html;
  document.querySelectorAll('video').forEach(function(v){ v.pause(); });
}
function show(i){ cur=(i+total)%total; render(cur); document.getElementById('cur').textContent=cur+1; document.getElementById('prog').style.width=((cur+1)/total*100)+'%'; }
function next(){ show(cur+1); } function prev(){ show(cur-1); }
document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev;
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();} if(e.key==='ArrowLeft'){e.preventDefault();prev();} });
document.getElementById('stage').addEventListener('click',function(e){ if(e.target.tagName==='VIDEO'||e.target.tagName==='BUTTON')return; next(); });
show(0);
